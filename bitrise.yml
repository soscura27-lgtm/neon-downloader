format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android

# La lógica de compilación vive en scripts/ci/build_apk.sh (así se cambia desde Git).
# Las variables de firma (NEON_KEYSTORE_*) se guardan solo en la configuración de la app en
# Bitrise, nunca en este repositorio público.
workflows:
  # APK firmado (githubRelease, arm64-v8a) + página pública de instalación para el celular.
  build-apk:
    summary: APK firmado de Neon Downloader
    steps:
    - git-clone@8: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: ./gradlew
    - script@1:
        title: Compilar APK firmado
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            bash scripts/ci/build_apk.sh githubRelease
    - deploy-to-bitrise-io@2:
        inputs:
        - is_enable_public_page: 'true'
        - notify_user_groups: none

  # Compilación de depuración, para comprobar que todo compila.
  check-debug:
    summary: Verifica que el proyecto compila
    steps:
    - git-clone@8: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: ./gradlew
    - script@1:
        title: Compilar APK de depuración
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            bash scripts/ci/build_apk.sh githubDebug
    - deploy-to-bitrise-io@2:
        inputs:
        - is_enable_public_page: 'false'
        - notify_user_groups: none
